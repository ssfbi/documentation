<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Módulo Administrador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Módulo Administrador</h1>
      <p>Acceso con clave fija del sistema</p>
    </header>

    <main class="layout single">
      <section class="card" id="admin-login-wrap">
        <h2>Ingreso administrador</h2>
        <label>Clave fija
          <input id="master-key" type="password" placeholder="Ingrese clave" />
        </label>
        <button id="admin-enter-btn" type="button">Entrar</button>
        <p id="admin-message" class="message"></p>
      </section>

      <section class="card hidden" id="admin-panel-wrap">
        <h2>Configuración de la app</h2>
        <div class="admin-tools">
          <label>Nombre de la app<input id="cfg-app-name" type="text" maxlength="80" /></label>
          <label>URL logo (opcional)<input id="cfg-logo" type="url" /></label>
          <label>Color principal<input id="cfg-color" type="color" /></label>
          <label>Sede de este equipo<select id="cfg-current-sede"></select></label>
          <button type="button" id="save-brand-btn">Guardar marca y sede local</button>
        </div>

        <h3>Sedes</h3>
        <div class="admin-tools inline">
          <input id="new-sede" type="text" placeholder="Nueva sede" />
          <button type="button" id="add-sede-btn">Crear sede</button>
        </div>
        <ul id="sede-list"></ul>

        <h3>Cargos y candidatos</h3>
        <div class="admin-tools inline">
          <input id="new-cargo" type="text" placeholder="Ej: Personero" />
          <button type="button" id="add-cargo-btn">Añadir cargo</button>
        </div>
        <div id="cargo-admin-list"></div>

        <h3>Resultados</h3>
        <div class="admin-tools inline">
          <select id="filter-sede"></select>
          <button id="pdf-btn" type="button">Generar acta PDF (imprimir)</button>
        </div>
        <div id="stats" class="stats"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
